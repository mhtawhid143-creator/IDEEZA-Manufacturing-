packages:
  - "apps/*"
  - "packages/*"

# Install scripts that are required for the toolchain to work:
#   esbuild        - places the platform binary vitest runs on
#   prisma/engines - downloads the query and schema engines the CLI needs
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
